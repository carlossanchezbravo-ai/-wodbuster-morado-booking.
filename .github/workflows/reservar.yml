name: Reserva WodBuster
run-name: "WodBuster — ${{ github.event_name == 'workflow_dispatch' && 'ejecución manual' || 'reserva programada' }}"

on:
  schedule:
    # Martes: se prepara con 25 minutos de margen y espera hasta las 15:00.
    - cron: '35 14 * * 0'
      timezone: Europe/Madrid
    # Jueves: se prepara con 25 minutos de margen y espera hasta las 22:30.
    - cron: '5 22 * * 0'
      timezone: Europe/Madrid
    # Viernes: se prepara el lunes con 25 minutos de margen y espera hasta las 22:30.
    - cron: '5 22 * * 1'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo prueba: inicia sesión y comprueba las clases sin reservar'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: wodbuster-reservation
  cancel-in-progress: false

jobs:
  book:
    name: Reservar (${{ matrix.account.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        account:
          - label: cuenta 1
            email_secret: WODBUSTER_EMAIL
            password_secret: WODBUSTER_PASSWORD
          - label: cuenta 2
            email_secret: WODBUSTER_EMAIL_2
            password_secret: WODBUSTER_PASSWORD_2

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalar dependencias
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-audit --no-fund

      - name: Instalar Chrome para Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Comprobar el código
        run: |
          npm run check
          npm test

      - name: Seleccionar día y hora de apertura
        id: booking
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'schedule={"tuesday":"16:00|CROSSFIT","thursday":"16:00|CROSSFIT","friday":"16:00|CROSSFIT"}' >> "$GITHUB_OUTPUT"
            echo 'label=martes, jueves y viernes' >> "$GITHUB_OUTPUT"
          elif [[ "$TRIGGER_CRON" == "35 14 * * 0" ]]; then
            echo 'schedule={"tuesday":"16:00|CROSSFIT"}' >> "$GITHUB_OUTPUT"
            echo 'opening_time=15:00:00' >> "$GITHUB_OUTPUT"
            echo 'label=martes' >> "$GITHUB_OUTPUT"
          elif [[ "$TRIGGER_CRON" == "5 22 * * 0" ]]; then
            echo 'schedule={"thursday":"16:00|CROSSFIT"}' >> "$GITHUB_OUTPUT"
            echo 'opening_time=22:30:00' >> "$GITHUB_OUTPUT"
            echo 'label=jueves' >> "$GITHUB_OUTPUT"
          elif [[ "$TRIGGER_CRON" == "5 22 * * 1" ]]; then
            echo 'schedule={"friday":"16:00|CROSSFIT"}' >> "$GITHUB_OUTPUT"
            echo 'opening_time=22:30:00' >> "$GITHUB_OUTPUT"
            echo 'label=viernes' >> "$GITHUB_OUTPUT"
          else
            echo "Disparador no reconocido: $TRIGGER_CRON" >&2
            exit 1
          fi

      - name: Calcular la apertura programada
        if: github.event_name == 'schedule'
        id: opening
        shell: bash
        env:
          OPENING_TIME: ${{ steps.booking.outputs.opening_time }}
        run: |
          local_date="$(TZ=Europe/Madrid date +%F)"
          target_seconds="$(TZ=Europe/Madrid date --date="$local_date $OPENING_TIME" +%s)"
          echo "target_ms=$((target_seconds * 1000))" >> "$GITHUB_OUTPUT"

      - name: Reservar ${{ steps.booking.outputs.label }} a las 16:00
        env:
          WODBUSTER_EMAIL: ${{ secrets[matrix.account.email_secret] }}
          WODBUSTER_PASSWORD: ${{ secrets[matrix.account.password_secret] }}
          WODBUSTER_BOX: 'morado'
          BOOKING_SCHEDULE: ${{ steps.booking.outputs.schedule }}
          BOOKING_DAYS_AHEAD: '7'
          JOIN_WAITLIST: 'false'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          BOOKING_TARGET_EPOCH_MS: ${{ steps.opening.outputs.target_ms || '' }}
        run: npm start
